<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anons</title>
<style>
  :root { --bg:#f6f6f4; --fg:#1b1b1b; --card:#fff; --mut:#777; --line:#ddd; --ok:#1a9e55; --bad:#d33; --acc:#2b6fd6; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161616; --fg:#eee; --card:#222; --mut:#999; --line:#333; } }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; margin:0; }
  body { font-family:system-ui,Segoe UI,sans-serif; background:var(--bg); color:var(--fg); overflow:hidden;
         padding:max(10px, env(safe-area-inset-top)) 10px max(10px, env(safe-area-inset-bottom)); }
  .hide { display:none !important; }
  button { font:inherit; font-weight:600; border:0; border-radius:12px; background:var(--acc); color:#fff; cursor:pointer; }
  button:disabled { opacity:.45; }
  button.ok { background:var(--ok); } button.bad { background:var(--bad); }
  button.ghost { background:transparent; color:var(--mut); border:1px solid var(--line); font-weight:500; }
  .badge { display:inline-block; padding:3px 10px; border-radius:99px; font-size:13px; background:var(--line); }
  .badge.on { background:var(--ok); color:#fff; } .badge.live { background:var(--bad); color:#fff; }

  /* PIN ekrani */
  #lock { height:100%; display:flex; align-items:center; justify-content:center; }
  #lock .box { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:24px; width:min(320px,100%); text-align:center; }
  #lock h1 { font-size:18px; margin:0 0 4px; } #lock p { margin:0 0 16px; color:var(--mut); font-size:14px; }
  #pin { font:inherit; font-size:24px; letter-spacing:6px; text-align:center; width:100%; padding:12px; border-radius:10px;
         border:1px solid var(--line); background:transparent; color:inherit; margin-bottom:12px; }
  #go { width:100%; padding:14px; }
  #err { color:var(--bad); font-size:14px; min-height:20px; margin:10px 0 0; }
  #swap { margin-top:10px; padding:6px 10px; font-size:13px; }

  /* KUMANDA: tek sayfa */
  #remote { height:100%; display:flex; flex-direction:column; gap:8px; }
  #bar { display:flex; justify-content:space-between; align-items:center; gap:8px; flex:0 0 auto; }
  #bar .l { display:flex; gap:8px; align-items:center; min-width:0; }
  #rState { font-size:13px; color:var(--mut); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #micRow { flex:0 0 28%; display:flex; gap:8px; min-height:0; }
  #talk { flex:1; font-size:clamp(16px,4.5vw,26px); touch-action:none; user-select:none; -webkit-user-select:none; background:var(--ok); }
  #talk.on { background:var(--bad); }
  #stop { flex:0 0 22%; font-size:clamp(14px,3.5vw,20px); }
  #grid { flex:1; min-height:0; display:grid; gap:8px; }
  #grid button { min-width:0; min-height:0; padding:4px; line-height:1.15; overflow:hidden; word-break:break-word; }
  #grid button:active { filter:brightness(1.25); }

  #ttsRow { flex:0 0 auto; display:flex; gap:8px; }
  #ttsText { flex:1; min-width:0; font:inherit; font-size:16px; padding:10px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:inherit; }
  #ttsGo { flex:0 0 auto; padding:0 16px; }
  #cfg { position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:center; justify-content:center; padding:16px; z-index:10; }
  #cfg .box { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px; width:min(380px,100%); display:flex; flex-direction:column; gap:10px; }
  #cfg input, #cfg select { font:inherit; padding:10px; border-radius:8px; border:1px solid var(--line); background:transparent; color:inherit; width:100%; }
  #cfg option { color:#000; }
  #cfg small { color:var(--mut); }

  /* HOPARLOR */
  #player { max-width:560px; margin:0 auto; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:10px; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  #log { font-size:13px; color:var(--mut); max-height:300px; overflow:auto; }
  #log div { padding:3px 0; border-bottom:1px solid var(--line); }
  #pVol { flex:1; }
</style>
</head>
<body>

<!-- PIN -->
<div id="lock">
  <div class="box">
    <h1 id="lockTitle">Anons Kumandası</h1>
    <p id="lockSub">PIN kodunu girin</p>
    <input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="••••">
    <button id="go" class="ok">Giriş</button>
    <div id="err"></div>
    <button id="swap" class="ghost"></button>
  </div>
</div>

<!-- KUMANDA -->
<div id="remote" class="hide">
  <div id="bar">
    <div class="l"><span class="badge" id="rConn">...</span><span id="rState"></span></div>
    <div style="display:flex;gap:6px">
      <button class="ghost" id="cfgOpen" style="padding:4px 10px;font-size:13px">Ses ayarı</button>
      <button class="ghost" id="logout" style="padding:4px 10px;font-size:13px">Çıkış</button>
    </div>
  </div>
  <div id="micRow">
    <button id="talk" disabled>Bağlanıyor...</button>
    <button id="stop" class="bad">Durdur</button>
  </div>
  <div id="ttsRow">
    <input id="ttsText" type="text" maxlength="300" placeholder="Yazın, seslendirilsin..." autocomplete="off">
    <button id="ttsGo" class="ok">Seslendir</button>
  </div>
  <div id="grid"></div>
</div>

<!-- ElevenLabs ayari -->
<div id="cfg" class="hide"><div class="box">
  <b>Yazıyı seslendirme (ElevenLabs)</b>
  <input id="xiKey" type="password" placeholder="API anahtarı" autocomplete="off">
  <button id="xiLoad" class="ghost" style="padding:10px">Sesleri getir</button>
  <select id="xiVoice"></select>
  <select id="xiModel">
    <option value="eleven_flash_v2_5">Flash v2.5 (hızlı, genelde daha az kredi)</option>
    <option value="eleven_multilingual_v2">Multilingual v2 (daha kaliteli)</option>
  </select>
  <label style="font-size:14px">Konuşma hızı: <b id="xiSpeedVal">1.00</b>x <small>(0.70 yavaş - 1.20 hızlı)</small></label>
  <input id="xiSpeed" type="range" min="0.7" max="1.2" step="0.05" value="1" style="padding:0">
  <small id="xiMsg">Anahtar yalnızca bu telefonda saklanır, GitHub'a gitmez.</small>
  <div style="display:flex;gap:8px">
    <button id="xiSave" class="ok" style="flex:1;padding:12px">Kaydet</button>
    <button id="xiClose" class="ghost" style="padding:12px">Kapat</button>
  </div>
</div></div>

<!-- HOPARLOR -->
<div id="player" class="hide">
  <div class="card row">
    <span class="badge" id="pConn">Kapalı</span>
    <span class="badge" id="pState">Boşta</span>
    <button class="ghost" id="pReset" style="padding:6px 10px;font-size:13px;margin-left:auto">PIN değiştir</button>
  </div>
  <div class="card row"><label>Ses</label><input type="range" id="pVol" min="0" max="1" step="0.01" value="1"></div>
  <div class="card"><div id="log"></div></div>
</div>

<audio id="snd"></audio>
<audio id="liveAudio" autoplay playsinline></audio>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="anahtar.js"></script>
<script>
const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
const store = {
  get: k => { try { return localStorage.getItem(k); } catch { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} }
};

// PIN'den sabit, siteye ozel bir baglanti kimligi uretir (PIN degismedikce kimlik de degismez)
async function idFor(pin) {
  const s = location.host + location.pathname.replace(/index\.html$/, '') + ':' + pin;
  if (window.crypto && crypto.subtle) {
    const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
    return 'anons-' + [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('').slice(0, 24);
  }
  let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) | 0;
  return 'anons-' + Math.abs(h);
}

let mode = (params.has('pc') || store.get('mode') === 'player') ? 'player' : 'remote';
function renderLock() {
  $('lockTitle').textContent = mode === 'player' ? 'Hoparlör (PC)' : 'Anons Kumandası';
  $('go').textContent = mode === 'player' ? 'Başlat' : 'Giriş';
  $('swap').textContent = mode === 'player' ? 'Bu cihaz kumanda (telefon)' : 'Bu cihaz PC hoparlörü';
}
$('swap').onclick = () => { mode = mode === 'player' ? 'remote' : 'player'; $('err').textContent = ''; renderLock(); };
renderLock();
$('pin').value = store.get('pin') || '';
$('pin').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
$('go').onclick = () => login(true);
if (store.get('pin') && mode === 'remote') login(false);   // kayitli PIN ile otomatik giris

async function login(gesture) {
  const pin = $('pin').value.trim();
  if (!pin) return;
  store.set('pin', pin); store.set('mode', mode);
  $('err').textContent = ''; $('go').disabled = true;
  if (mode === 'player') {
    $('snd').src = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAESsAABErAAABAAgAZGF0YQAAAAA=';
    $('snd').play().catch(() => {});
    startPlayer(await idFor(pin));
  } else {
    if (gesture) getMic();            // mikrofon iznini giris tiklamasiyla iste
    startRemote(await idFor(pin));
  }
}
function lockError(t) { $('lock').classList.remove('hide'); $('remote').classList.add('hide'); $('err').textContent = t; $('go').disabled = false; }

/* ================= HOPARLOR (PC) ================= */
function startPlayer(id) {
  $('lock').classList.add('hide'); $('player').classList.remove('hide');
  const snd = $('snd'), liveAudio = $('liveAudio');
  let peer, queue = [], playing = false, live = false, label = '', cur = null;
  const conns = new Set();
  const log = t => { const d = document.createElement('div'); d.textContent = new Date().toLocaleTimeString('tr-TR') + '  ' + t; $('log').prepend(d); };
  const broadcast = m => conns.forEach(c => c.open && c.send(m));
  const setState = (t, c) => { $('pState').textContent = t; $('pState').className = 'badge ' + (c || ''); broadcast({ t: 'state', text: t }); };

  $('pVol').oninput = e => { snd.volume = liveAudio.volume = +e.target.value; };
  $('pReset').onclick = () => { store.set('pin', ''); location.reload(); };

  function open() {
    peer = new Peer(id);
    peer.on('open', () => { $('pConn').textContent = 'Hazır'; $('pConn').className = 'badge on'; log('Sistem hazır, kumanda bekleniyor'); });
    peer.on('error', e => {
      if (e.type === 'unavailable-id') { $('pConn').textContent = 'Eski oturum kapanıyor...'; setTimeout(() => { peer.destroy(); open(); }, 4000); }
      else log('Hata: ' + e.type);
    });
    peer.on('disconnected', () => { $('pConn').textContent = 'Koptu'; $('pConn').className = 'badge'; peer.reconnect(); });
    peer.on('connection', c => {
      conns.add(c);
      c.on('open', () => { log('Kumanda bağlandı'); c.send({ t: 'state', text: $('pState').textContent }); });
      c.on('data', onMsg);
      c.on('close', () => { conns.delete(c); log('Kumanda ayrıldı'); setLive(false); });
    });
    peer.on('call', call => {
      call.answer();
      call.on('stream', s => { liveAudio.srcObject = s; liveAudio.play().catch(() => {}); });
    });
  }
  open();

  function onMsg(m) {
    if (m.t === 'play') {
      const ok = Array.isArray(m.files) && m.files.every(f => /^sounds\/[^\/\\]+$/.test(f));
      if (!ok) return;
      log('Gelen: ' + m.label);
      queue.push(...m.files.map(f => ({ f, label: m.label }))); next();
    }
    else if (m.t === 'tts' && m.audio) {
      const url = URL.createObjectURL(new Blob([m.audio], { type: 'audio/mpeg' }));
      log('Yazıdan anons: ' + m.label);
      queue.push({ f: url, label: m.label }); next();
    }
    else if (m.t === 'stop') { queue = []; playing = false; snd.pause(); setState('Boşta'); log('Durduruldu'); }
    else if (m.t === 'live') setLive(!!m.on);
  }
  function setLive(on) {
    if (on === live) return; live = on;
    if (on) { if (playing) snd.pause(); setState('CANLI', 'live'); log('Canlı yayın'); }
    else if (playing) { snd.play().catch(() => {}); setState('Çalıyor: ' + label, 'on'); }
    else { setState('Boşta'); next(); }
  }
  function next() {
    if (live || playing || !queue.length) return;
    const it = queue.shift(); cur = it; label = it.label; playing = true;
    setState('Çalıyor: ' + label, 'on');
    snd.src = new URL(it.f, location.href).href;
    snd.play().catch(e => { log('Çalma hatası: ' + e.message); playing = false; next(); });
  }
  snd.onended = snd.onerror = () => { if (!playing) return; if (cur && cur.f.startsWith('blob:')) URL.revokeObjectURL(cur.f); playing = false; if (!queue.length && !live) setState('Boşta'); next(); };
}

/* ================= KUMANDA (telefon) ================= */
let peer, conn, retry, attempts = 0, loggedIn = false, connected = false, stream, call, micDenied = false, targetId;

function startRemote(id) {
  targetId = id; attempts = 0;
  $('rConn').textContent = 'Bağlanıyor...';
  createPeer();
}
function createPeer() {
  if (peer) peer.destroy();
  peer = new Peer();
  peer.on('open', dial);
  peer.on('disconnected', () => { try { peer.reconnect(); } catch {} });
  peer.on('error', e => {
    if (e.type === 'peer-unavailable') {
      attempts++;
      if (!loggedIn && attempts >= 3) { peer.destroy(); return lockError('Bağlanılamadı. PIN yanlış olabilir veya PC\'deki hoparlör açık değil.'); }
      retry = setTimeout(dial, 2000);
    } else if (!loggedIn) { lockError('Bağlantı kurulamadı (' + e.type + ').'); }
    else { retry = setTimeout(createPeer, 3000); }
  });
}
function dial() {
  clearTimeout(retry);
  try { conn = peer.connect(targetId, { reliable: true }); } catch { retry = setTimeout(createPeer, 3000); return; }
  conn.on('open', () => {
    connected = true; attempts = 0;
    if (!loggedIn) { loggedIn = true; $('lock').classList.add('hide'); $('remote').classList.remove('hide'); loadSounds(); autoKey($('pin').value.trim()); }
    $('rConn').textContent = 'Bağlı'; $('rConn').className = 'badge on';
    updateMic(); if (stream) startCall();
  });
  conn.on('data', m => { if (m.t === 'state') $('rState').textContent = m.text; });
  conn.on('close', () => {
    connected = false; $('rConn').textContent = 'Koptu'; $('rConn').className = 'badge'; $('rState').textContent = '';
    updateMic(); retry = setTimeout(dial, 3000);
  });
}
const send = m => { if (conn && conn.open) conn.send(m); else $('rState').textContent = 'Bağlantı yok'; };
function startCall() { if (call) call.close(); call = peer.call(targetId, stream); }

/* mikrofon */
async function getMic() {
  if (stream) return;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
    stream.getAudioTracks().forEach(t => t.enabled = false);
    micDenied = false; if (connected) startCall();
  } catch { micDenied = true; }
  updateMic();
}
const talk = $('talk');
function updateMic() {
  talk.classList.remove('on');
  if (!connected) { talk.disabled = true; talk.textContent = 'Bağlantı yok'; return; }
  talk.disabled = false;
  talk.textContent = stream ? 'BASILI TUT VE KONUŞ' : (micDenied ? 'Mikrofon izni yok - tekrar dene' : 'Mikrofonu aç (dokun)');
}
function setMic(on) {
  stream.getAudioTracks().forEach(t => t.enabled = on);
  send({ t: 'live', on });
  talk.classList.toggle('on', on);
  talk.textContent = on ? 'YAYINDA' : 'BASILI TUT VE KONUŞ';
}
talk.addEventListener('pointerdown', async e => {
  e.preventDefault(); if (!connected) return;
  if (!stream) { await getMic(); return; }
  talk.setPointerCapture(e.pointerId); setMic(true);
});
['pointerup', 'pointercancel'].forEach(ev => talk.addEventListener(ev, () => { if (stream && talk.classList.contains('on')) setMic(false); }));
talk.addEventListener('contextmenu', e => e.preventDefault());

$('stop').onclick = () => send({ t: 'stop' });
$('logout').onclick = () => { store.set('pin', ''); location.reload(); };

/* ses butonlari: GitHub'daki sounds/ klasorunden otomatik */
function labelOf(name) {
  const s = name.replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' ').trim();
  return s.charAt(0).toLocaleUpperCase('tr') + s.slice(1);
}
function renderButtons(names) {
  const g = $('grid'); g.innerHTML = '';
  [...names].sort((a, b) => a.localeCompare(b, 'tr')).forEach(n => {
    const b = document.createElement('button'); b.textContent = labelOf(n);
    b.onclick = () => send({ t: 'play', label: labelOf(n), files: ['sounds/' + n] });
    g.appendChild(b);
  });
  layout();
}
async function loadSounds() {
  let cached = null; try { cached = JSON.parse(store.get('snd') || 'null'); } catch {}
  if (cached) renderButtons(cached);
  let names = null;
  try {
    const user = location.hostname.split('.')[0];
    let seg = location.pathname.split('/')[1] || ''; if (seg.endsWith('.html')) seg = '';
    const repo = seg || location.hostname;
    const r = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/sounds`);
    if (r.ok) names = (await r.json()).filter(x => x.type === 'file' && /\.(mp3|wav|ogg|m4a|aac)$/i.test(x.name)).map(x => x.name);
  } catch {}
  if (!names) { try { names = (await (await fetch('sounds.json?_=' + Date.now())).json()).dosyalar; } catch {} }
  if (names) { store.set('snd', JSON.stringify(names)); renderButtons(names); }
  else if (!cached) $('grid').textContent = 'Ses listesi alınamadı';
}

/* ElevenLabs: yaziyi seslendir */
const xi = { key: store.get('xikey') || '', voice: store.get('xivoice') || '', model: store.get('ximodel') || 'eleven_flash_v2_5', speed: parseFloat(store.get('xispeed')) || 1, embedded: false };
// anahtar.js icindeki PIN ile sifrelenmis API anahtarini coz
async function autoKey(pin) {
  const A = window.ANAHTAR; if (!A || xi.key) return;
  try {
    const u = t => Uint8Array.from(atob(t), c => c.charCodeAt(0));
    const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveKey']);
    const k = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: u(A.s), iterations: 200000, hash: 'SHA-256' }, km, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    xi.key = new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u(A.i) }, k, u(A.d)));
    xi.embedded = true;
  } catch {}
}
const xmsg = t => $('xiMsg').textContent = t;
function setVoices(list, sel) {
  const s = $('xiVoice'); s.innerHTML = '';
  list.forEach(v => { const o = document.createElement('option'); o.value = v.id; o.textContent = v.name; s.appendChild(o); });
  if (sel) s.value = sel;
}
async function xiErr(r) {
  try { const j = await r.json(), d = j.detail; return (d && (d.message || d.status)) || (typeof d === 'string' ? d : 'Hata ' + r.status); }
  catch { return 'Hata ' + r.status; }
}
$('cfgOpen').onclick = () => {
  $('xiKey').value = xi.embedded ? '' : xi.key; $('xiKey').placeholder = xi.embedded ? 'Gömülü anahtar kullanılıyor' : 'API anahtarı'; $('xiModel').value = xi.model; $('xiSpeed').value = xi.speed; $('xiSpeedVal').textContent = xi.speed.toFixed(2);
  if (xi.voice) setVoices([{ id: xi.voice, name: store.get('xivname') || xi.voice }], xi.voice);
  $('cfg').classList.remove('hide');
};
$('xiSpeed').oninput = e => { $('xiSpeedVal').textContent = (+e.target.value).toFixed(2); };
$('xiClose').onclick = () => $('cfg').classList.add('hide');
$('xiLoad').onclick = async () => {
  const key = $('xiKey').value.trim() || xi.key; if (!key) return xmsg('Önce API anahtarını girin');
  xmsg('Sesler getiriliyor...');
  try {
    const r = await fetch('https://api.elevenlabs.io/v1/voices', { headers: { 'xi-api-key': key } });
    if (!r.ok) return xmsg(await xiErr(r));
    const vs = (await r.json()).voices.sort((a, b) => (a.category === 'premade' ? 0 : 1) - (b.category === 'premade' ? 0 : 1));
    setVoices(vs.map(v => ({ id: v.voice_id, name: v.name + (v.category ? ' (' + v.category + ')' : '') })), xi.voice);
    xmsg(vs.length + ' ses bulundu. "premade" olanlar ücretsiz planda çalışır.');
  } catch { xmsg('Bağlantı hatası'); }
};
$('xiSave').onclick = () => {
  const sel = $('xiVoice');
  const typed = $('xiKey').value.trim(); if (typed) { xi.key = typed; xi.embedded = false; store.set('xikey', typed); }
  xi.voice = sel.value; xi.model = $('xiModel').value; xi.speed = +$('xiSpeed').value; store.set('xispeed', xi.speed);
  store.set('xivoice', xi.voice); store.set('ximodel', xi.model);
  store.set('xivname', sel.options[sel.selectedIndex] ? sel.options[sel.selectedIndex].textContent : '');
  $('cfg').classList.add('hide');
};
async function speak() {
  const text = $('ttsText').value.trim(); if (!text) return;
  if (!xi.key || !xi.voice) { $('cfgOpen').click(); return; }
  if (!connected) { $('rState').textContent = 'Bağlantı yok'; return; }
  $('ttsGo').disabled = true; $('rState').textContent = 'Ses üretiliyor...';
  try {
    const body = { text, model_id: xi.model, voice_settings: { stability: 0.5, similarity_boost: 0.75, speed: xi.speed } };
    if (xi.model === 'eleven_flash_v2_5') body.language_code = 'tr';
    const r = await fetch('https://api.elevenlabs.io/v1/text-to-speech/' + encodeURIComponent(xi.voice), {
      method: 'POST', headers: { 'xi-api-key': xi.key, 'Content-Type': 'application/json' }, body: JSON.stringify(body)
    });
    if (!r.ok) { $('rState').textContent = 'ElevenLabs: ' + await xiErr(r); return; }
    send({ t: 'tts', label: text.slice(0, 30), audio: await r.arrayBuffer() });
    $('ttsText').value = ''; $('rState').textContent = 'Gönderildi';
  } catch { $('rState').textContent = 'Ses üretilemedi (internet?)'; }
  finally { $('ttsGo').disabled = false; }
}
$('ttsGo').onclick = speak;
$('rState').onclick = () => { const t = $('rState').textContent; if (t) alert(t); };
$('ttsText').addEventListener('keydown', e => { if (e.key === 'Enter') speak(); });

/* butonlari ekrana tam sigdir */
function layout() {
  const g = $('grid'), n = g.children.length; if (!n) return;
  const w = g.clientWidth, h = g.clientHeight, gap = 8;
  let best = 1, bs = Infinity;
  for (let c = 1; c <= n; c++) {
    const r = Math.ceil(n / c), cw = (w - gap * (c - 1)) / c, ch = (h - gap * (r - 1)) / r;
    if (cw <= 0 || ch <= 0) continue;
    const s = Math.abs(Math.log(cw / ch / 1.8)); if (s < bs) { bs = s; best = c; }
  }
  const rows = Math.ceil(n / best);
  g.style.gridTemplateColumns = `repeat(${best}, 1fr)`;
  g.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
  const cw = (w - gap * (best - 1)) / best, ch = (h - gap * (rows - 1)) / rows;
  const maxLen = Math.max(...[...g.children].map(b => b.textContent.length));
  g.style.fontSize = Math.max(11, Math.min(26, ch * 0.35, cw / (maxLen * 0.62))) + 'px';
}
window.addEventListener('resize', layout);
new ResizeObserver(layout).observe(document.getElementById('grid'));
</script>
